set -g @agent_session_waiting '#{W:#{?@agent_waiting,1,}}'
set -g @agent_session_working '#{W:#{?@agent_working,1,}}'
set -g @agent_window_suffix '#{?@agent_waiting, (#{?@agent_title,#{q/h:@agent_title} ,}waiting...),}'
set -g @agent_working_count '#{n:#{S:#{?#{E:@agent_session_waiting},,#{?#{E:@agent_session_working},x,}}}}'
set -g @agent_now '%s'
set -g window-status-format '#I:#W#{E:@agent_window_suffix}#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#I:#W#{E:@agent_window_suffix}#{?window_flags,#{window_flags}, }'
set -g status-right-length 120
set -g status-right '#{?#{S:#{E:@agent_session_waiting}},#[fg=themeblack#,bg=darkorange] waiting: #{S:#{?#{E:@agent_session_waiting},#{q/h:session_name} ,}}#[default] ,}#{?#{E:@agent_working_count},#{E:@agent_working_count} working ,}#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'
set -g @agent_session_tree_format '#{?pane_format,#{?pane_marked,#[fg=thememagenta],}#{?pane_floating_flag,#[underscore],}#{pane_current_command}#[fg=themelightgrey]#{pane_flags}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},window_format,#{?window_marked_flag,#[fg=thememagenta],}#{window_name}#{E:@agent_window_suffix}#[fg=themelightgrey]#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#[fg=themelightgrey]#{?#{E:@agent_session_waiting},#[fg=themeblack#,bg=darkorange#,fill=darkorange],#{?#{E:@agent_session_working},#[fg=themeblack#,bg=themegreen#,fill=themegreen],}}#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}#{?#{E:@agent_session_waiting},#{W:#{E:@agent_window_suffix}},#{W:#{?@agent_working, (#{?@agent_title,#{q/h:@agent_title} ,}working...),}}}}'
bind s choose-tree -Zs -F '#{E:@agent_session_tree_format}'
bind w choose-tree -Zw -F '#{E:@agent_session_tree_format}'
bind S {
  choose-tree -Zs -F '#{E:@agent_session_tree_format}'
  run-shell -b "TMUX_PANE=#{pane_id} ~/.local/bin/tmux-agent-status sessions #{q:client_name}"
}
bind a run-shell -b "TMUX_PANE=#{pane_id} ~/.local/bin/tmux-agent-status next #{q:client_name}"
set-hook -g pane-title-changed {
  if -F '#{m/r:^tmux-agent-status waiting [A-Za-z0-9 ]+$,#{hook_new_title}}' {
    run-shell "TMUX_PANE=#{hook_pane} ~/.local/bin/tmux-agent-status waiting '#{s/^tmux-agent-status waiting //:hook_new_title}'"
  }
  if -F '#{==:#{hook_new_title},tmux-agent-status working}' {
    run-shell 'TMUX_PANE=#{hook_pane} ~/.local/bin/tmux-agent-status working'
  }
  if -F '#{==:#{hook_new_title},tmux-agent-status clear}' {
    run-shell 'TMUX_PANE=#{hook_pane} ~/.local/bin/tmux-agent-status clear'
  }
}
set -g @agent_orphans '#{S:#{W:#{?#{&&:#{@agent_pane},#{==:#{P:#{?#{==:#{pane_id},#{@agent_pane}},1,}},}},#{pane_id} ,}}}'
set-hook -g window-layout-changed {
  if -F '#{E:@agent_orphans}' {
    run-shell 'for pane in #{E:@agent_orphans}; do TMUX_PANE=$pane ~/.local/bin/tmux-agent-status clear; done'
  }
}
run-shell -C '#{S:#{W:#{?@agent_name,rename-window -t #{window_id} -- #{q:@agent_name} ; #{?#{!=:#{@agent_auto},off},set-option -w -u -t #{window_id} automatic-rename ; ,}set-option -w -u -t #{window_id} @agent_name ; set-option -w -u -t #{window_id} @agent_auto ; ,}}}'
